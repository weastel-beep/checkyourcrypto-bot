name: Auto Backup

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Каждый день в 2:00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install psycopg2-binary
          
      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date +"%Y%m%d_%H%M%S")
          BACKUP_DIR="backup_${DATE}"
          
          echo "Creating backup: $BACKUP_DIR"
          
          # Создаем структуру бэкапа
          mkdir -p "$BACKUP_DIR/code"
          mkdir -p "$BACKUP_DIR/config"
          mkdir -p "$BACKUP_DIR/database"
          
          # Копируем код
          rsync -av --exclude='node_modules' \
                   --exclude='venv' \
                   --exclude='__pycache__' \
                   --exclude='.git' \
                   --exclude='backups' \
                   --exclude='logs' \
                   . "$BACKUP_DIR/code/"
          
          # Копируем конфиги
          cp Procfile "$BACKUP_DIR/config/" 2>/dev/null || true
          cp requirements.txt "$BACKUP_DIR/config/" 2>/dev/null || true
          cp alembic.ini "$BACKUP_DIR/config/" 2>/dev/null || true
          
          # Бэкап БД (если есть доступ)
          if [ ! -z "$DATABASE_URL" ]; then
            pg_dump "$DATABASE_URL" > "$BACKUP_DIR/database/database_backup.sql" 2>/dev/null || echo "Database backup failed"
          fi
          
          # Информация о бэкапе
          cat > "$BACKUP_DIR/backup_info.txt" << EOF
          Backup created: $(date)
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref }}
          Event: ${{ github.event_name }}
          EOF
          
          echo "Backup created: $BACKUP_DIR"
          
      - name: Upload backup artifact
        uses: actions/upload-artifact@v3
        with:
          name: backup-${{ github.sha }}-${{ github.run_number }}
          path: backup_*/
          retention-days: 30
          
      - name: Create backup tag
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "backup-${{ github.sha }}" -m "Auto backup from ${{ github.sha }}"
          git push origin "backup-${{ github.sha }}"
