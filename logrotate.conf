# Logrotate конфигурация для Check Your Crypto
/Users/valera/checkyourcrypto/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    postrotate
        # Перезапуск процессов если нужно
        # systemctl reload checkyourcrypto
    endscript
}
