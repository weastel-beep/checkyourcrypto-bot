services:
  - type: web
    name: checkyourcrypto-admin
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: settings
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: checkyourcrypto-admin-db
          property: connectionString

databases:
  - name: checkyourcrypto-admin-db
    databaseName: checkyourcrypto_admin
    user: checkyourcrypto_admin
